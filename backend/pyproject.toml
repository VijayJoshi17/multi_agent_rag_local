[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag-backend"
version = "1.0.0"
license = "MIT"
description = "Multi-agent RAG backend: LangGraph orchestration, hybrid retrieval, sandboxed data analysis."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.50",
    "langgraph>=0.2.50",
    "langchain-text-splitters>=0.3",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "tabulate>=0.9",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "yfinance>=0.2.50",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Document templates: wrapping would change the generated text.
"eval/distractors.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
